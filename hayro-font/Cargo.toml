[package]
name = "hayro-font"
version = "0.5.0"
description = "A crate for parsing the fonts of PDF files."
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[dependencies]
bitflags = { workspace = true }
hayro-cmap = { workspace = true }
hayro-syntax = { workspace = true }
kurbo = { workspace = true }
phf = { workspace = true, features = ["macros"] }
rustc-hash = { workspace = true }
hashbrown = { workspace = true }
libm = { workspace = true }
siphasher = { workspace = true }
skrifa = { workspace = true }

[features]
default = ["std", "embed-fonts"]
# Use the standard library (without it the crate is no_std + alloc).
std = ["hayro-syntax/std", "skrifa/std", "kurbo/std"]
# Embed a light-weight set of fonts (around 240KB) that can be used as a substitute for the 14 PDF standard fonts.
embed-fonts = []

[lints]
workspace = true
